<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HRM Portal - Employees</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">
            HRM <span>Portal</span>
        </div>

        <nav>

            <a href="index.html">
                🏠 Dashboard
            </a>

            <a href="employees.html" class="active">
                👥 Employees
            </a>

            <a href="attendance.html">
                🕒 Attendance
            </a>

            <a href="leave.html">
                📅 Leave
            </a>

            <a href="payroll.html">
                💰 Payroll
            </a>

            <a href="departments.html">
                🏢 Departments
            </a>

            <a href="performance.html">
                📊 Performance
            </a>

            <a href="setting.html">
                ⚙️ Settings
            </a>

        </nav>

        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">

        <!-- TOP BAR -->

        <header class="topbar">

            <div>

                <h1>
                    Employees
                </h1>

                <p>
                    Manage employee records
                </p>

            </div>


            <div class="profile">

                <div class="avatar">
                    A
                </div>

                <div>

                    <strong>
                        Admin
                    </strong>

                    <small>
                        HR Manager
                    </small>

                </div>

            </div>

        </header>


        <!-- ================= EMPLOYEE PANEL ================= -->

        <section class="panel">

            <!-- TOOLBAR -->

            <div class="toolbar">

                <input
                    type="text"
                    id="employeeSearch"
                    placeholder="Search employee..."
                    oninput="searchEmployees()"
                >

                <button
                    class="primary-btn"
                    onclick="openEmployeeForm()">

                    + Add Employee

                </button>

            </div>


            <!-- ================= EMPLOYEE FORM ================= -->

            <div
                id="employeeForm"
                class="form-box hidden">

                <h2 id="employeeFormTitle">
                    Add Employee
                </h2>


                <div class="form-grid">

                    <!-- NAME -->

                    <input
                        type="text"
                        id="empName"
                        placeholder="Full Name"
                    >


                    <!-- EMAIL -->

                    <input
                        type="email"
                        id="empEmail"
                        placeholder="Email"
                    >


                    <!-- MOBILE -->

                    <input
                        type="tel"
                        id="empMobile"
                        placeholder="Mobile Number"
                        maxlength="10"
                    >


                    <!-- DEPARTMENT -->

                    <input
                        type="text"
                        id="empDepartment"
                        placeholder="Department"
                    >


                    <!-- ROLE -->

                    <input
                        type="text"
                        id="empRole"
                        placeholder="Job Role"
                    >


                    <!-- JOINING DATE -->

                    <div class="date-field">

                        <label for="empJoiningDate">
                            Joining Date
                        </label>

                        <input
                            type="date"
                            id="empJoiningDate"
                        >

                    </div>


                    <!-- EXIT DATE -->

                    <div class="date-field">

                        <label for="empExitDate">
                            Exit Date
                        </label>

                        <input
                            type="date"
                            id="empExitDate"
                        >

                    </div>

                </div>


                <!-- FORM BUTTONS -->

                <div class="form-actions">

                    <button
                        id="saveEmployeeBtn"
                        class="primary-btn"
                        onclick="addEmployee()">

                        Save Employee

                    </button>


                    <button
                        class="secondary-btn"
                        onclick="closeEmployeeForm()">

                        Cancel

                    </button>

                </div>

            </div>


            <!-- ================= EMPLOYEE TABLE ================= -->

            <div class="table-container">

                <table id="employeeTable">

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Mobile Number</th>

                            <th>Department</th>

                            <th>Role</th>

                            <th>Joining Date</th>

                            <th>Exit Date</th>

                            <th>Action</th>

                            <th>Edit Details</th>

                        </tr>

                    </thead>


                    <tbody id="employeeBody">

                        <!-- Employees loaded by JavaScript -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="employees.js"></script>

</body>

</html>
